# /etc/sysctl.d/99-eck.conf
# Parâmetros de kernel para Kubernetes + Elasticsearch (ECK).
# Aplicar com: sudo cp 99-eck.conf /etc/sysctl.d/ && sudo sysctl --system

# --- Rede exigida pelo Kubernetes (tráfego em bridge visível ao iptables) ---
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward                 = 1

# --- Exigência do Elasticsearch (memory-mapped files), ES 8.16+ / 9.x ---
vm.max_map_count                    = 1048576
