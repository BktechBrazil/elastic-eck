# LLM local (Ollama) rodando NO cluster — expõe API compatível com OpenAI (Módulo 12).
# Endpoint p/ o conector do Kibana: http://ollama.elastic.svc:11434/v1
# ATENÇÃO (16 GB): pesado. Use modelo pequeno (llama3.2:1b). Ideal 32 GB. Rode isolado.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: elastic
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 15Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: elastic
  labels: { app: ollama }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: 3Gi
              cpu: "2"
            limits:
              memory: 5Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: elastic
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
  type: ClusterIP
# Depois de subir, baixe um modelo pequeno:
#   kubectl -n elastic exec deploy/ollama -- ollama pull llama3.2:1b
# Teste a API OpenAI-compatível:
#   kubectl -n elastic exec deploy/ollama -- \
#     curl -s http://localhost:11434/v1/models
