<!DOCTYPE html>
<!--
  TEMPLATE DE SLIDES — Elastic Stack Total (Edição ECK)
  Como usar: copie este arquivo para NN-modulo/slides.html e edite os <section class="slide">.
  Navegação: setas ← →, teclas Espaço/Backspace, ou os botões no rodapé. Tecla "f" = tela cheia.
  100% autocontido (sem dependências externas) — abre offline no navegador.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides — Módulo NN</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#111a33; --ink:#e8ecf6; --muted:#9fb0d0;
    --brand:#00bfb3;   /* teal Elastic */
    --brand2:#fec514;  /* amarelo Elastic */
    --accent:#1ba9f5;  /* azul Elastic */
    --pink:#ee5396; --card:#16203c; --code:#0a1330; --line:#26355e;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#05070f;color:var(--ink)}
  .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:6vh 8vw;animation:fade .35s ease}
  .slide.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .slide{background:radial-gradient(1200px 600px at 15% -10%,var(--bg2),var(--bg) 60%)}
  /* Slide de título/capa */
  .slide.cover{background:linear-gradient(135deg,#071b33 0%,#0b1020 55%,#160a2b 100%);text-align:left}
  .cover .kicker{color:var(--brand);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:1rem}
  .cover h1{font-size:clamp(2.2rem,6vw,4.4rem);margin:.2em 0;line-height:1.05}
  .cover h1 span{background:linear-gradient(90deg,var(--brand),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cover .sub{color:var(--muted);font-size:clamp(1rem,2.2vw,1.5rem);max-width:60ch}
  h2{font-size:clamp(1.6rem,3.6vw,2.6rem);margin:0 0 .6em;line-height:1.1}
  h2 .num{color:var(--brand);font-variant-numeric:tabular-nums}
  p,li{font-size:clamp(1rem,1.8vw,1.35rem);line-height:1.5;color:#dbe4f7}
  .muted{color:var(--muted)}
  ul.clean{list-style:none;padding:0;margin:0}
  ul.clean li{padding:.35em 0 .35em 1.6em;position:relative}
  ul.clean li::before{content:"▸";color:var(--brand);position:absolute;left:0;top:.35em}
  /* Grid de cards */
  .grid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:.4em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem}
  .card h3{margin:.1em 0 .4em;font-size:1.15rem;color:#fff}
  .card .ico{font-size:1.6rem}
  .tag{display:inline-block;background:rgba(0,191,179,.15);color:var(--brand);border:1px solid rgba(0,191,179,.4);
    padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600}
  /* Código */
  pre{background:var(--code);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:10px;padding:1rem 1.2rem;overflow:auto;font-size:1rem}
  code{font-family:"Cascadia Code",Consolas,Monaco,monospace;color:#c8f5ef}
  pre .c{color:#6b7ba8}       /* comentário */
  pre .k{color:var(--brand2)} /* comando/keyword */
  /* Caixas de aviso */
  .note{border-radius:10px;padding:.8rem 1.1rem;margin-top:.6em;border-left:4px solid var(--brand)}
  .note.tip{background:rgba(34,197,94,.10);border-color:var(--ok)}
  .note.warn{background:rgba(245,158,11,.12);border-color:var(--warn)}
  .note.info{background:rgba(27,169,245,.10);border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;align-items:start}
  /* Rodapé/HUD */
  .hud{position:fixed;left:0;right:0;bottom:0;height:8px;background:#0a1226}
  .hud .bar{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .3s}
  .foot{position:fixed;bottom:14px;right:18px;display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
  .foot button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:.35em .7em;cursor:pointer;font-size:1rem}
  .foot button:hover{border-color:var(--brand)}
  .brandmark{position:fixed;top:16px;left:22px;font-weight:700;color:var(--muted);font-size:.85rem;letter-spacing:.05em}
  .brandmark b{color:var(--brand)}
</style>
</head>
<body>
<div class="brandmark"><b>Elastic Stack Total</b> · Edição ECK</div>
<div class="deck" id="deck">

  <!-- CAPA -->
  <section class="slide cover active">
    <div class="kicker">Módulo NN</div>
    <h1>Título do <span>Módulo</span></h1>
    <p class="sub">Subtítulo curto explicando o objetivo do módulo em uma frase.</p>
  </section>

  <!-- CONTEÚDO (exemplos de blocos) -->
  <section class="slide">
    <h2><span class="num">01.</span> Tópico</h2>
    <ul class="clean">
      <li>Ponto um.</li>
      <li>Ponto dois.</li>
    </ul>
    <div class="note tip"><b>Dica:</b> texto de dica.</div>
  </section>

  <section class="slide">
    <h2><span class="num">02.</span> Comandos</h2>
    <pre><code><span class="c"># comentário</span>
<span class="k">kubectl</span> get nodes</code></pre>
  </section>

</div>

<div class="foot">
  <button onclick="prev()">◀</button>
  <span id="count">1 / 1</span>
  <button onclick="next()">▶</button>
</div>
<div class="hud"><div class="bar" id="bar"></div></div>

<script>
  const slides=[...document.querySelectorAll('.slide')];
  let i=0;
  function render(){
    slides.forEach((s,n)=>s.classList.toggle('active',n===i));
    document.getElementById('count').textContent=(i+1)+' / '+slides.length;
    document.getElementById('bar').style.width=((i+1)/slides.length*100)+'%';
  }
  function next(){i=Math.min(i+1,slides.length-1);render();}
  function prev(){i=Math.max(i-1,0);render();}
  document.addEventListener('keydown',e=>{
    if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next();}
    if(['ArrowLeft','Backspace','PageUp'].includes(e.key)){e.preventDefault();prev();}
    if(e.key==='f'){document.documentElement.requestFullscreen?.();}
    if(e.key==='Home'){i=0;render();} if(e.key==='End'){i=slides.length-1;render();}
  });
  render();
</script>
</body>
</html>
